[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pydotenvcage"
version = "1.0.0"
description = "Zero-dependency strict dotenv parser, expansion firewall, secret-leak auditor, schema validator, redactor, differ, and safe environment loader"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "pydotenvcage contributors" }]
keywords = [
    "dotenv",
    "env",
    "environment",
    "security",
    "secret-scanning",
    "cwe-798",
    "cwe-15",
    "cwe-20",
    "cwe-78",
    "zero-dependency",
    "parser",
    "schema",
    "redaction",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.scripts]
pydotenvcage = "pydotenvcage.cli:main"

[project.urls]
Homepage = "https://github.com/draarivpatel-ui/pydotenvcage"
Repository = "https://github.com/draarivpatel-ui/pydotenvcage"
Issues = "https://github.com/draarivpatel-ui/pydotenvcage/issues"
Documentation = "https://github.com/draarivpatel-ui/pydotenvcage#readme"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["pydotenvcage*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
pydotenvcage = ["py.typed"]
