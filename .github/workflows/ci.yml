name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: PYTHONPATH=src python3 -m unittest discover -s tests

      - name: Run CLI smoke tests
        run: |
          printf 'PORT=8080\nHOST=localhost\n' > /tmp/pydotenvcage-ci.env
          printf '{"required":["PORT"],"keys":{"PORT":{"type":"integer","min":1,"max":65535},"HOST":{"type":"string","minLength":1}}}' > /tmp/pydotenvcage-schema.json
          PYTHONPATH=src python3 -m pydotenvcage parse /tmp/pydotenvcage-ci.env --json
          PYTHONPATH=src python3 -m pydotenvcage audit /tmp/pydotenvcage-ci.env --json
          PYTHONPATH=src python3 -m pydotenvcage validate /tmp/pydotenvcage-ci.env --schema /tmp/pydotenvcage-schema.json --json
          PYTHONPATH=src python3 -m pydotenvcage redact /tmp/pydotenvcage-ci.env
          PYTHONPATH=src python3 -m pydotenvcage --version


  package:
    name: build distributions
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install build tooling
        run: python -m pip install --require-hashes -r .github/requirements/build-requirements.txt

      - name: Build distributions
        run: python -m build
      - name: Verify distribution contents
        run: python scripts/check_dist.py dist
