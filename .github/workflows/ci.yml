name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: PYTHONPATH=src python3 -m unittest discover -s tests
      - name: Run CLI smoke tests
        run: |
          printf 'PORT=8080\nHOST=localhost\n' > /tmp/pydotenvcage-ci.env
          printf '{"required":["PORT"],"keys":{"PORT":{"type":"integer","min":1,"max":65535},"HOST":{"type":"string","minLength":1}}}' > /tmp/pydotenvcage-schema.json
          PYTHONPATH=src python3 -m pydotenvcage parse /tmp/pydotenvcage-ci.env --json
          PYTHONPATH=src python3 -m pydotenvcage audit /tmp/pydotenvcage-ci.env --json
          PYTHONPATH=src python3 -m pydotenvcage validate /tmp/pydotenvcage-ci.env --schema /tmp/pydotenvcage-schema.json --json
          PYTHONPATH=src python3 -m pydotenvcage redact /tmp/pydotenvcage-ci.env
          PYTHONPATH=src python3 -m pydotenvcage --version
      - name: Install build tooling
        run: python3 -m pip install build
      - name: Build source and wheel distributions
        run: python3 -m build
      - name: Verify distribution contents
        run: python3 scripts/check_dist.py dist
